<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>소음 측정 (마이크)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.2rem; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 12px 0; }
    .big { font-size: 2.6rem; font-weight: 700; }
    .row { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0; }
    button { font-size: 1rem; padding: 10px 16px; border-radius: 8px; border: 1px solid #888; background: #f4f4f4; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    input { font-size: 1rem; padding: 8px; width: 90px; }
    .ok { color: #15803d; } .err { color: #b91c1c; } .muted { color: #666; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>매장 소음 측정</h1>

  <div class="card">
    <button id="btnStart" class="primary">측정 시작</button>
    <button id="btnStop" disabled>중지</button>
    <p id="status" class="muted">대기 중</p>
  </div>

  <div class="card">
    <div class="row"><span>소음</span><span><span id="db" class="big">--</span> dB</span></div>
    <div class="row"><span>음성대역 비율 (300~3400Hz)</span><strong id="voice">--</strong></div>
    <div class="row"><span>서버 전송</span><span id="send" class="muted">-</span></div>
  </div>

  <div class="card">
    <strong>dB 보정</strong>
    <p class="muted">소음계 앱(또는 소음계)이 보여주는 값을 입력하고 [보정]을 누르세요.
      폰 마이크는 기기마다 감도가 달라서 한 번 보정해야 dB 값이 의미를 가집니다.</p>
    <div class="row">
      <span><input id="refDb" type="number" min="20" max="120" step="0.1" placeholder="예: 62"> dB</span>
      <button id="btnCal" disabled>보정</button>
    </div>
    <div class="row"><span class="muted">현재 보정값(오프셋)</span><span id="offset" class="muted">-</span></div>
  </div>

  <script src="/static/audio_metrics.js"></script>
  <script>
    const FRAME_MS = 50;         // 20번/초 분석
    const SEND_MS = 3000;        // 3초마다 평균을 서버로 전송 (계획서: 연산 주기 3초)
    const DEFAULT_OFFSET = 90;   // dBFS → dB 기본 변환값 (보정하면 덮어씀)
    const OFFSET_KEY = "snoopy_cal_offset";

    const $ = (id) => document.getElementById(id);
    let ctx = null, stream = null, analyser = null, timeBuf = null, freqBuf = null;
    let frameTimer = null, sendTimer = null, wakeLock = null;
    let acc = AudioMetrics.createAccumulator();
    let offset = loadOffset();
    let lastDbfs = null;

    function loadOffset() {
      try {
        const v = parseFloat(localStorage.getItem(OFFSET_KEY));
        if (isFinite(v)) return v;
      } catch (e) { /* 저장소를 못 쓰는 브라우저 */ }
      return DEFAULT_OFFSET;
    }
    function saveOffset(v) {
      try { localStorage.setItem(OFFSET_KEY, String(v)); } catch (e) { /* 무시 */ }
    }
    function showOffset() { $("offset").textContent = offset.toFixed(1); }
    function setStatus(msg, cls) { const s = $("status"); s.textContent = msg; s.className = cls || "muted"; }

    function frame() {
      analyser.getFloatTimeDomainData(timeBuf);
      analyser.getFloatFrequencyData(freqBuf);
      acc.add(timeBuf, freqBuf, ctx.sampleRate, analyser.fftSize);
    }

    async function sendWindow() {
      const r = acc.result(offset);
      acc.reset();
      if (!r) return;
      lastDbfs = r.dbfs;
      $("db").textContent = r.noise_db.toFixed(1);
      $("voice").textContent = r.voice_ratio === null ? "--" : r.voice_ratio.toFixed(2);

      const body = { noise_db: r.noise_db };
      if (r.voice_ratio !== null) body.voice_ratio = r.voice_ratio;
      try {
        const res = await fetch("/api/update-noise", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        $("send").textContent = "성공 " + new Date().toLocaleTimeString();
        $("send").className = "ok";
      } catch (e) {
        $("send").textContent = "실패: " + e.message;
        $("send").className = "err";
      }
    }

    async function start() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("이 주소에서는 마이크를 쓸 수 없습니다. HTTPS 주소(또는 localhost)로 접속하세요.", "err");
        return;
      }
      try {
        // 측정용이므로 브라우저의 자동 보정 기능을 모두 끈다 (켜면 dB가 왜곡됨)
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        });
      } catch (e) {
        setStatus("마이크 권한이 거부되었거나 사용할 수 없습니다: " + e.name, "err");
        return;
      }
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") await ctx.resume();
      const src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0;       // 프레임마다 독립적인 스펙트럼
      src.connect(analyser);                    // 스피커(destination)에는 연결하지 않음 (하울링 방지)
      timeBuf = new Float32Array(analyser.fftSize);
      freqBuf = new Float32Array(analyser.frequencyBinCount);

      acc.reset();
      frameTimer = setInterval(frame, FRAME_MS);
      sendTimer = setInterval(sendWindow, SEND_MS);
      try {
        if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");  // 화면 꺼짐 방지
      } catch (e) { /* 지원하지 않으면 무시 */ }

      $("btnStart").disabled = true; $("btnStop").disabled = false; $("btnCal").disabled = false;
      setStatus("측정 중 (3초마다 서버로 전송)", "ok");
    }

    function stop() {
      clearInterval(frameTimer); clearInterval(sendTimer);
      frameTimer = sendTimer = null;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (ctx) ctx.close();
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      stream = ctx = analyser = null;
      $("btnStart").disabled = false; $("btnStop").disabled = true; $("btnCal").disabled = true;
      setStatus("중지됨");
    }

    function calibrate() {
      const ref = parseFloat($("refDb").value);
      if (!isFinite(ref) || ref < 20 || ref > 120) { setStatus("기준 dB를 20~120 사이로 입력하세요.", "err"); return; }
      if (lastDbfs === null) { setStatus("측정값이 아직 없습니다. 3초 정도 기다린 뒤 다시 누르세요.", "err"); return; }
      offset = AudioMetrics.calibrationOffset(ref, lastDbfs);
      saveOffset(offset);
      showOffset();
      setStatus("보정 완료 (오프셋 " + offset.toFixed(1) + ")", "ok");
    }

    $("btnStart").addEventListener("click", start);
    $("btnStop").addEventListener("click", stop);
    $("btnCal").addEventListener("click", calibrate);
    showOffset();
  </script>
</body>
</html>
